name: SAST Multi-Tool Benchmark (4 Tools - PyGoat)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sast_scans:
    name: Run 4 SAST Tools & Benchmark Evaluation
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create Results Directory
        run: mkdir -p sast-results

      # ----------------------------------------------------
      # 1. Bandit Scan (AST Pattern Matching)
      # ----------------------------------------------------
      - name: Run Bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f json -o sast-results/bandit.json || true
          echo "Bandit scan finished."

      # ----------------------------------------------------
      # 2. Semgrep Scan (Modern Rule-Based & Taint Analysis)
      # ----------------------------------------------------
      - name: Run Semgrep
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep scan --config auto --json -o sast-results/semgrep.json . || true
          echo "Semgrep scan finished."

      # ----------------------------------------------------
      # 3. Bearer CLI Scan (API & Data Flow Security)
      # ----------------------------------------------------
      - name: Run Bearer
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh
          ./bin/bearer scan . --format json --output sast-results/bearer.json || true
          echo "Bearer scan finished."

      # ----------------------------------------------------
      # 4. CodeQL Scan (Advanced Semantic Analysis)
      # ----------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          output: sast-results/codeql-sarif-dir

      - name: Prepare CodeQL SARIF
        continue-on-error: true
        run: |
          if [ -f "sast-results/codeql-sarif-dir/python.sarif" ]; then
            cp sast-results/codeql-sarif-dir/python.sarif sast-results/codeql.sarif
          fi

      # ----------------------------------------------------
      # EVALUATION: Compute TP, FP, FN, Precision, Recall, F1 for 15 Combinations
      # ----------------------------------------------------
      - name: Run Evaluation Script
        run: |
          python scripts/evaluate.py

      # ----------------------------------------------------
      # Upload Results & Artifacts
      # ----------------------------------------------------
      - name: Upload SAST Reports & CSV Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-evaluation-results
          path: |
            sast_evaluation_summary.csv
            sast_vulnerability_breakdown.csv
            sast-results/
